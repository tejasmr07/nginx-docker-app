<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dockerized Nginx App Updated </title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 48px;
    max-width: 560px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .badge {
    display: inline-block;
    background: #22c55e;
    color: #052e16;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 12px;
  }
  p {
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  code {
    background: rgba(255,255,255,0.1);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.9em;
  }
  .footer {
    margin-top: 28px;
    font-size: 0.85rem;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">RUNNING ON NGINX</span>
    <h1>🐳 Hello from your Docker container Updated V1!</h1>
    <h1>🚀 This is Automated Poll SCM Deploy <code>nginx</code></h1>

  </div>
</body>
</html>
